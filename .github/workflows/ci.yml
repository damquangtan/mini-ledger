name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest   # runner có sẵn Docker daemon -> Testcontainers chạy được
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven          # cache ~/.m2 theo hash của pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw      # commit từ Windows thường mất quyền thực thi

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
