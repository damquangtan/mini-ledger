databaseChangeLog:
  - changeSet:
      id: 001-create-account
      author: tan
      changes:
        - createTable:
            tableName: account
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: code, type: VARCHAR(32), constraints: { nullable: false, unique: true } }
              - column: { name: currency, type: CHAR(3), constraints: { nullable: false } }
              - column: { name: balance, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
  - changeSet:
      id: 002-create-journal-and-ledger
      author: tan
      changes:
        - createTable:
            tableName: journal_transaction
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: reference, type: VARCHAR(64), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_journal_reference } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: now(), constraints: { nullable: false } }
        - createTable:
            tableName: ledger_entry
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: journal_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: account_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: amount, type: BIGINT, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: ledger_entry
            baseColumnNames: journal_id
            constraintName: fk_entry_journal
            referencedTableName: journal_transaction
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: ledger_entry
            baseColumnNames: account_id
            constraintName: fk_entry_account
            referencedTableName: account
            referencedColumnNames: id
        - createIndex:
            tableName: ledger_entry
            indexName: ix_entry_account
            columns:
              - column: { name: account_id }
        - sql:
            sql: ALTER TABLE ledger_entry ADD CONSTRAINT ck_entry_amount_nonzero CHECK (amount <> 0)